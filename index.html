<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YGO Banlist Hub - Custom Banlist Section Edition</title>
  
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar">

  <!-- Header -->
  <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex justify-between items-center">
      <div class="flex items-center gap-3">
        <i class="fa-solid fa-crown text-yellow-500 text-2xl"></i>
        <div>
          <h1 class="font-bold text-xl tracking-wide text-yellow-500">YGO COMMUNITY BANLIST</h1>
          <p class="text-xs text-slate-400">Banlist Custom Bài Thủ Nộp & Kiểm tra YDKE toàn diện</p>
        </div>
      </div>
      
      <!-- User Auth Bar -->
      <div id="authContainer" class="flex items-center gap-3">
        <button id="btnLogin" onclick="loginWithGoogle()" class="bg-yellow-500 hover:bg-yellow-600 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition flex items-center gap-2">
          <i class="fa-brands fa-google"></i> Đăng nhập
        </button>
        <div id="userInfo" class="hidden flex items-center gap-3 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
          <img id="userAvatar" class="w-7 h-7 rounded-full border border-yellow-500" src="" alt="Avatar">
          <div class="flex flex-col">
            <span id="userName" class="text-xs font-semibold text-slate-200">User</span>
            <span id="userPermissionBadge" class="text-[9px] text-yellow-500 font-bold"></span>
          </div>
          <button onclick="logout()" class="text-slate-400 hover:text-red-400 text-sm ml-2" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Body -->
  <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-grow space-y-8">

    <!-- ADMIN CONTROL PANEL -->
    <section id="adminPanel" class="hidden bg-slate-900 border border-yellow-500/40 rounded-xl p-5 shadow-xl space-y-4">
      <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center border-b border-slate-800 pb-3 gap-3">
        <h2 class="font-bold text-lg text-yellow-500 flex items-center gap-2">
          <i class="fa-solid fa-user-shield"></i> Bảng Quản Lý Admin
        </h2>
        <button onclick="publishAllSubmissions()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-4 py-2 rounded-lg text-xs transition flex justify-center items-center gap-2">
          <i class="fa-solid fa-bull
